version: '3.8'

# ── Self-play:  start_selfplay.bat   → docker-compose --profile selfplay up --build --scale worker=1
# ── Tournament: start_tournament.bat → docker-compose --profile tournament up --build --scale worker=1

services:

  data_writer:
    build: .
    command: >
      python game_data_writer_service.py
      --mode ${WRITER_MODE:-selfplay}
    environment:
      - PYTHONUNBUFFERED=1
      - DATASETS_FILEPATH=/data/selfplay.hdf5
      - TOURNAMENT_DATASETS_FILEPATH=/data/tournament_games.hdf5
      - TOURNAMENT_RESULTS_FILEPATH=/data/tournament_results.jsonl
    volumes:
      - ./shared_data:/data
    networks:
      - mcts_net

  # ── Self-play only ───────────────────────────────────────────────────

  model_provider:
    build: .
    command: python model_provider_service.py --mode ${WORKER_MODE:-selfplay}
    volumes:
      - ./shared_models:/models
    networks:
      - mcts_net

  trainer:
    build: .
    command: python training_service.py
    volumes:
      - ./shared_data:/data
      - ./shared_models:/models
      - ./training_meta:/training_meta
    depends_on:
      - data_writer
      - model_provider
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mcts_net

  # ── Shared ───────────────────────────────────────────────────────────

  inference_server:
    build: .
    command: python inference_service.py
    environment:
      - TORCHINDUCTOR_CACHE_DIR=/tmp/triton_cache
      - PYTHONUNBUFFERED=1
    volumes:
      - ./triton_cache:/tmp/triton_cache
    depends_on:
      - model_provider
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mcts_net

  worker:
    build: .
    command: >
      python self_play_service.py
      --mode ${WORKER_MODE:-selfplay}
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    depends_on:
      - data_writer
      - inference_server
    networks:
      - mcts_net

  # ── Tournament only ──────────────────────────────────────────────────

  tournament_manager:
    build: .
    profiles: ["tournament"]
    command: python tournament_manager.py
    environment:
      - PYTHONUNBUFFERED=1
      - TOURNAMENT_DATASETS_FILEPATH=/data/tournament_games.hdf5
      - TOURNAMENT_RESULTS_FILEPATH=/data/tournament_results.jsonl
    volumes:
      - ./shared_models:/models
      - ./shared_data:/data
    depends_on:
      - data_writer
      - inference_server
    networks:
      - mcts_net

networks:
  mcts_net:
    driver: bridge
